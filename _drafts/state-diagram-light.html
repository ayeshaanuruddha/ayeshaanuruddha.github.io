<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Webhook State Machine Diagram - High Contrast</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .diagram-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
      width: 100%;
      max-width: 920px;
      padding: 30px 28px;
    }
    .diagram-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge-bar {
      display: flex;
      gap: 16px;
      font-size: 0.82em;
      font-weight: 700;
      color: #334155;
    }
    .badge-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }
    .canvas-container {
      background: #f8fafc;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      padding: 25px 15px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div class="diagram-card">
    
    <!-- Header with Legend -->
    <div class="diagram-header">
      <div>
        <div style="font-size: 0.76em; text-transform: uppercase; letter-spacing: 1.5px; color: #0284c7; font-weight: 800;">
          [FIN-INT-101] State Engine &amp; Exception Routing
        </div>
        <h2 style="font-size: 1.3em; color: #0f172a; margin-top: 4px; font-weight: 800;">
          POS Ingestion &amp; Journal Lifecycle State Machine
        </h2>
      </div>
      <div class="badge-bar">
        <div class="badge-item">
          <span class="dot" style="background: #0284c7;"></span> Queued
        </div>
        <div class="badge-item">
          <span class="dot" style="background: #10b981;"></span> Validated
        </div>
        <div class="badge-item">
          <span class="dot" style="background: #9333ea;"></span> ERP Posted
        </div>
        <div class="badge-item">
          <span class="dot" style="background: #e11d48;"></span> DLQ / Exception
        </div>
      </div>
    </div>

    <!-- High-Contrast SVG Diagram -->
    <div class="canvas-container">
      <svg viewBox="0 0 860 620" width="100%" style="min-width: 760px; max-width: 860px; display: block; margin: 0 auto;" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Arrow Markers -->
          <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
          </marker>
          <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#e11d48" />
          </marker>
          <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
          </marker>
        </defs>

        <!-- ================= PRIMARY SPINE (DOWNWARDS ON LEFT) ================= -->

        <!-- 1. INBOUND WEBHOOK (Component Box) -->
        <rect x="85" y="30" width="230" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
        <text x="200" y="58" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="800" text-anchor="middle">[ Inbound Webhook ]</text>
        <text x="200" y="72" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">POST /api/v1/pos/transaction</text>

        <!-- Spine Arrow: Webhook -> QUEUED -->
        <path d="M 200 80 L 200 150" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-dark)" />
        <rect x="120" y="102" width="160" height="26" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
        <text x="200" y="119" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HTTPS Ingress (T+0)</text>

        <!-- 2. QUEUED (State Pill) -->
        <rect x="95" y="150" width="210" height="50" rx="25" fill="#0f172a" stroke="#0284c7" stroke-width="2.5" />
        <text x="200" y="181" fill="#38bdf8" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="800" text-anchor="middle">( QUEUED )</text>

        <!-- Spine Arrow: QUEUED -> VALIDATED -->
        <path d="M 200 200 L 200 310" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-dark)" />
        <rect x="110" y="242" width="180" height="26" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
        <text x="200" y="259" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Unique Idempotency Key</text>

        <!-- 3. VALIDATED (State Pill) -->
        <rect x="85" y="310" width="230" height="50" rx="25" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
        <text x="200" y="341" fill="#34d399" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="800" text-anchor="middle">( VALIDATED )</text>

        <!-- Spine Arrow: VALIDATED -> ERP_POSTED -->
        <path d="M 200 360 L 200 470" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-dark)" />
        <rect x="95" y="402" width="210" height="26" rx="5" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
        <text x="200" y="419" fill="#047857" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&Sigma; Debits == &Sigma; Credits ($0.00)</text>

        <!-- 4. ERP_POSTED (State Pill) -->
        <rect x="85" y="470" width="230" height="50" rx="25" fill="#0f172a" stroke="#9333ea" stroke-width="2.5" />
        <text x="200" y="501" fill="#c084fc" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="800" text-anchor="middle">( ERP_POSTED )</text>

        <!-- Final Outcome Box -->
        <rect x="100" y="540" width="200" height="30" rx="4" fill="#ffffff" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="200" y="560" fill="#7e22ce" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" text-anchor="middle">[Atomic Journal Committed]</text>


        <!-- ================= EXCEPTION BRANCHES (TO THE RIGHT) ================= -->

        <!-- BRANCH 1: From QUEUED to DUPLICATE_IGNORED -->
        <path d="M 305 175 L 540 175" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)" />
        <!-- Condition Badge -->
        <rect x="325" y="162" width="195" height="26" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
        <text x="422" y="179" fill="#334155" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">[ Redis Duplicate Key ]</text>
        
        <!-- Node: DUPLICATE_IGNORED -->
        <rect x="540" y="150" width="260" height="50" rx="25" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
        <text x="670" y="181" fill="#cbd5e1" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="800" text-anchor="middle">( DUPLICATE_IGNORED )</text>
        
        <!-- Remediation Sub-Box -->
        <rect x="575" y="215" width="190" height="28" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="670" y="233" fill="#475569" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="700" text-anchor="middle">[Return HTTP 200 • Suppress Post]</text>
        <path d="M 670 200 L 670 215" fill="none" stroke="#475569" stroke-width="2" />


        <!-- BRANCH 2: From VALIDATED to PAYLOAD_ERROR / DLQ -->
        <path d="M 315 335 L 535 335" fill="none" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrow-red)" />
        <!-- Condition Badge -->
        <rect x="325" y="322" width="190" height="26" rx="5" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" />
        <text x="420" y="339" fill="#be123c" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">[ Math Error / Imbalance ]</text>
        
        <!-- Node: PAYLOAD_ERROR / DLQ -->
        <rect x="535" y="310" width="270" height="50" rx="25" fill="#1e293b" stroke="#e11d48" stroke-width="2.5" />
        <text x="670" y="341" fill="#fb7185" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="800" text-anchor="middle">( PAYLOAD_ERROR / DLQ )</text>

        <!-- Remediation Sub-Box -->
        <rect x="560" y="375" width="220" height="28" rx="4" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="670" y="393" fill="#be123c" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="700" text-anchor="middle">[DLQ Enqueued • PagerDuty Alert]</text>
        <path d="M 670 360 L 670 375" fill="none" stroke="#e11d48" stroke-width="2" />

      </svg>
    </div>

    <!-- Footnote Meta -->
    <div style="margin-top: 18px; font-size: 0.82em; color: #475569; display: flex; justify-content: space-between; flex-wrap: wrap; font-weight: 600;">
      <span><strong>Specification:</strong> FIN-INT-101 (POS-to-Ledger Integration)</span>
      <span><strong>Idempotency Window:</strong> 24h Redis TTL • ACID Enforced</span>
    </div>

  </div>

</body>
</html>
