    url: https://github.com/ayeshaanuruddha

# Build settings
markdown: kramdown
permalink: pretty

exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - freelancer-theme-jekyll.gemspec
  - README.md
  - screenshot.png
  - vendor

# Portfolio items get real pages at /projects/<slug>/ and feed the home page card grid
collections:
  projects:
    output: true
    permalink: /projects/:name/
